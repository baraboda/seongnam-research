<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 성남시 연구논문 분석</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* 배경 장식 */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, transparent 70%);
            top: -150px;
            right: -100px;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0%, transparent 70%);
            bottom: -100px;
            left: -80px;
            border-radius: 50%;
        }

        .login-box {
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 1;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #d97706, #fbbf24);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.3);
        }

        .login-sub {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d97706;
            margin-bottom: 6px;
        }

        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.4);
            background: #1e293b;
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-icon">📊</div>
        <div class="login-sub">Hwaseong Research Insight</div>
        <h1>성남시 연구논문 분석</h1>
        <p>연구보고서 기반 현안 분석 카드에<br>접근하려면 로그인이 필요합니다</p>
        <button onclick="netlifyIdentity.open()">로그인</button>
    </div>
    <script>
        netlifyIdentity.on("login", () => {
            location.href = "/";
        });
    </script>
</body>
</html>
